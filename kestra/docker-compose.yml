services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kestra:
    image: kestra/kestra:latest
    pull_policy: always
    command: server standalone
    user: root
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kestra_data:/app/storage
    env_file:
      - path: .env
        required: false   # kein Fehler beim ersten Start – erst `make secrets` ausführen
    environment:
      # Uncomment the next line if you're on an M4 chip and Kestra crashes with SIGILL
      # JAVA_OPTS: "-XX:UseSVE=0"
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: kestra
        kestra:
          server:
            basicAuth:
              enabled: false
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd
          url: http://localhost:8088/
    restart: unless-stopped

volumes:
  postgres_data:
  kestra_data:
